name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CC: gcc-14
  CXX: g++-14
  CLANG_TOOLS_VERSION: 23.1.3   # PyPI clang-format / clang-tidy; keep in sync with the developers' version

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 libarmadillo-dev libblas-dev liblapack-dev
      - name: Configure (standalone, Release)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      # Qt-free by contract: the core's scripts/check-no-qt.sh covers math as
      # well, from the openindy-core CI.
      - uses: astral-sh/setup-uv@v6
      # Every check enabled in .clang-tidy is a failing check, for the sources and the
      # headers this repo owns (HeaderFilterRegex in .clang-tidy; the checkout directory
      # is named openindy-math, which the regex anchors on).
      - name: clang-tidy (.clang-tidy checks, must be clean)
        run: |
          git ls-files 'src/*.cpp' | xargs -P$(nproc) -n4 \
            uvx --from clang-tidy==$CLANG_TOOLS_VERSION clang-tidy -p build --quiet \
              --warnings-as-errors='*'

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: clang-format --dry-run -Werror
        run: |
          git ls-files | grep -E '\.(cpp|h|hpp|cc)$' | grep -vE '^(lib|third_party|3rdparty|build)/' \
            | xargs uvx clang-format==$CLANG_TOOLS_VERSION --dry-run -Werror --style=file
